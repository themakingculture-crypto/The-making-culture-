:root{--bg:#faf6ee;--card:#fffdf8;--ink:#111a2c;--muted:#5d6677;--line:#e6dcc6;--forest:#14213d;--sage:#f0e2bd;--butter:#ffe9a8;--peach:#e8d5bd;--lilac:#d4dfe6;--coral:#e0a62e;--on:#faf3e3;

a{color:inherit}:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 15px "DM Sans",sans-serif;text-decoration:none;padding:14px 26px;border-radius:999px;border:0;cursor:pointer;transition:transform .2s;background:var(--coral);color:#111a2c}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn.dark{background:var(--ink);color:var(--on)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;margin:10px auto 0;max-width:1076px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 12px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px}
.logo img{height:46px;display:block;border-radius:12px;background:#fff}
nav ul{display:flex;gap:24px;align-items:center;list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{text-decoration:none}nav .btn{padding:11px 22px;font-size:14px}
.hero{display:grid;gap:36px;align-items:center;padding:56px 0 40px}
.tag{display:inline-block;font-size:13px;font-weight:500;background:var(--butter);color:#111a2c;padding:6px 14px;border-radius:999px;margin-bottom:20px}
.hero h1{font-size:clamp(44px,8vw,78px)}
.hero p{color:var(--muted);max-width:40ch;margin:20px 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.art{position:relative;background:var(--sage);border-radius:200px 200px 32px 32px;padding:36px 28px 28px;display:grid;place-items:center}
.art img{width:100%;max-width:340px;border-radius:24px;background:#fff;display:block}
.chip{position:absolute;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;color:#111a2c;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.c1{background:var(--butter);left:-6px;top:38%;transform:rotate(-6deg)}.c2{background:var(--peach);right:-6px;bottom:22%;transform:rotate(5deg)}
